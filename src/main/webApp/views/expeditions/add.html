<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>
</head>
<body>


<h1>Add new Expedition</h1>

<form method="POST" action="/exam1_war/expeditions/add">

    <div>
        <label for="id">ID:</label>
        <input
                type="number"
                id="id"
                name="id"
                placeholder="ID"
                required
        >
    </div>

    <br>

    <div>
        <label for="name">Name:</label>
        <input
                type="text"
                id="name"
                name="name"
                placeholder="Name"
                required
        >
    </div>

    <br>

    <div>
        <label for="code">Code:</label>
        <input
                type="text"
                id="code"
                name="code"
                placeholder="Code - Must be unique"
                required
        >
    </div>

    <br>

    <div>
        <label for="region">Region:</label>
        <input
                type="text"
                id="region"
                name="region"
                placeholder="Ex: Amazonia, Costa pacifica"
        >
    </div>

    <br>

    <div>
        <label for="baseCamp">Base Camp:</label>
        <input
                type="text"
                id="baseCamp"
                name="baseCamp"
                placeholder="Expedition camp location"
        >
    </div>

    <br>

    <div>
        <label for="leader">Base Camp:</label>
        <input
                type="text"
                id="leader"
                name="leader"
                placeholder="Expedition leader"
        >
    </div>

    <br>

    <div>
        <label for="classType">Class type:</label>

        <select id="classType" name="classType" required>

            <option value="">
                Select a class type
            </option>

            <option value="Explorer">
                Explorer
            </option>

            <option value="Fighter">
                Fighter
            </option>

            <option value="Cargo">
                Cargo
            </option>

        </select>
    </div>

    <br>

    <div>
        <label for="captain">Captain:</label>
        <input
                type="text"
                id="captain"
                name="captain"
                placeholder="Captain"
                required
        >
    </div>

    <br>

    <div>
        <label for="commissionDate">
            Date of entry into service:
        </label>

        <input
                type="date"
                id="commissionDate"
                name="commissionDate"
                placeholder="Commission Date"
                required
        >
    </div>

    <br>

    <div>
        <label for="status">Status:</label>

        <select id="status" name="status" required>

            <option value="">
                Select a status
            </option>

            <option value="Active">
                Active
            </option>

            <option value="Docked">
                Docked
            </option>

            <option value="Decommissioned">
                Decommissioned
            </option>

        </select>
    </div>

    <br>

    <button type="submit">
        Add Starship
    </button>

</form>

</body>
</html>
